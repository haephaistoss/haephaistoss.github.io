<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="refresh" content="600"> <!-- Refresh the page every 10 minutes (600 seconds) -->
  <title>Google Slides Presentation</title>
  <style>
    /* Ensure the body and html elements take the full width and height of the viewport */
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }

    /* Set the iframe to fill the width and height of its container */
    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>
  <iframe src="https://docs.google.com/presentation/d/e/2PACX-1vRF97-zqbBI2rGC-7Y2R84-5Y4f0UuONMWGfQkmcm7cxjFPsr2WhcNB-VTM9Lbu69658e1ulL3i1SbB/embed?start=true&loop=true&delayms=10000" allowfullscreen="true" mozallowfullscreen="true" webkitallowfullscreen="true"></iframe>
</body>
</html>

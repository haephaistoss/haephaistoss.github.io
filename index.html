<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="refresh" content="180"> <!-- Refresh the page every 5 minutes (300 seconds) -->
  <title>Google Slides Presentation</title>
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
  <script>
    function enterFullscreen() {
      const docElem = document.documentElement;

      if (docElem.requestFullscreen) {
        docElem.requestFullscreen();
      } else if (docElem.mozRequestFullScreen) { // Firefox
        docElem.mozRequestFullScreen();
      } else if (docElem.webkitRequestFullscreen) { // Chrome, Safari and Opera
        docElem.webkitRequestFullscreen();
      } else if (docElem.msRequestFullscreen) { // IE/Edge
        docElem.msRequestFullscreen();
      }
    }

    document.addEventListener("DOMContentLoaded", () => {
      setTimeout(() => {
        enterFullscreen();
      }, 100);
    });
  </script>
</head>
<body>
  <iframe src="https://docs.google.com/presentation/d/e/2PACX-1vRF97-zqbBI2rGC-7Y2R84-5Y4f0UuONMWGfQkmcm7cxjFPsr2WhcNB-VTM9Lbu69658e1ulL3i1SbB/embed?start=true&loop=true&delayms=10000" allowfullscreen="true" mozallowfullscreen="true" webkitallowfullscreen="true"></iframe>
</body>
</html>
